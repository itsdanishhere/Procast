services:
  postgres:
    image: postgres:16
    container_name: procast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: procast
      POSTGRES_PASSWORD: procast
      POSTGRES_DB: procast
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procast -d procast"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - procast-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: procast-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - procast-redis:/data

volumes:
  procast-postgres:
  procast-redis:
